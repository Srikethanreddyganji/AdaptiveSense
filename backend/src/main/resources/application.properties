spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Connection pool limits to minimize memory footprint in <=512MB RAM environments
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

# Embedded Tomcat thread and memory bounds
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=10
server.tomcat.max-connections=100

server.port=${PORT:8081}
spring.mvc.async.request-timeout=240000
spring.servlet.multipart.max-file-size=${AUDIO_MAX_SIZE_BYTES:10485760}B
spring.servlet.multipart.max-request-size=${AUDIO_MAX_REQUEST_SIZE_BYTES:11534336}B

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.internal-key=${AI_SERVICE_INTERNAL_KEY:}

ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:3b}
ollama.connect-timeout=${OLLAMA_CONNECT_TIMEOUT:5s}
ollama.read-timeout=${OLLAMA_READ_TIMEOUT:180s}
ollama.num-ctx=${OLLAMA_NUM_CTX:4096}
ollama.num-predict=${OLLAMA_NUM_PREDICT:220}
ollama.keep-alive=${OLLAMA_KEEP_ALIVE:5m}
ollama.request-queue-timeout=${OLLAMA_REQUEST_QUEUE_TIMEOUT:90s}

app.environment=${ENVIRONMENT:development}
audio.max-size-bytes=${AUDIO_MAX_SIZE_BYTES:10485760}
audio.max-duration-seconds=${AUDIO_MAX_DURATION_SECONDS:60}
